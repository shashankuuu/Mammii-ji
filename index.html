
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Wish - Munni Devi Ji</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #845ec2);
    color: white;
    text-align: center;
}

.card {
    width: 85%;
    max-width: 420px;
    padding: 35px 20px;
    border-radius: 25px;
    background: rgba(255,255,255,0.15);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}

.cake {
    font-size: 70px;
    animation: bounce 1.5s infinite;
}

h1 {
    font-size: 30px;
    margin: 15px 0;
}

h2 {
    font-size: 24px;
    margin: 10px 0 20px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

.heart {
    font-size: 35px;
    animation: beat 1s infinite;
}

@keyframes bounce {
    50% { transform: translateY(-12px); }
}

@keyframes beat {
    50% { transform: scale(1.25); }
}
</style>
</head>

<body>

<div class="card">

    <div class="cake">&#127874;</div>

    <h1>Happy Birthday! &#127881;</h1>

    <h2>Shri Munni Devi Ji</h2>

    <p>
        Meri pyari Mummy ❤️
        <br><br>
        Aap meri zindagi ki sabse special person hain.
        <br>
        Bhagwan aapko hamesha khush,
        swasth aur muskurata rakhe.
        <br><br>
        Aapka pyaar mere liye sabse bada gift hai.
    </p>

    <div class="heart">&#10084;</div>

    <p>With lots of love ❤️</p>

</div>

</body>
</html>
