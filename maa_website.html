.glow{position:absolute;width:330px;height:330px;border-radius:50%;
background:rgba(255,182,193,.22);filter:blur(55px);top:12%;left:50%;transform:translateX(-50%)}
.card{position:relative;z-index:2;width:min(90%,520px);padding:36px 24px;
border:1px solid rgba(255,255,255,.35);border-radius:28px;
background:rgba(70,10,30,.32);backdrop-filter:blur(7px);
box-shadow:0 15px 50px rgba(0,0,0,.45)}
.small{font-size:14px;letter-spacing:3px;text-transform:uppercase;opacity:.9}
h1{font-size:clamp(48px,15vw,82px);margin:10px 0 4px;color:#ffd9e2;text-shadow:0 3px 20px #000}
h2{font-size:clamp(22px,6vw,32px);margin:0 0 20px;color:#fff0f4}
p{font-size:18px;line-height:1.7;margin:10px auto;max-width:430px}
button{margin-top:22px;padding:14px 28px;border:0;border-radius:999px;
background:#ffd1dc;color:#5a1027;font-weight:bold;font-size:16px;
box-shadow:0 8px 25px rgba(255,160,190,.25);cursor:pointer}
.heart{position:absolute;bottom:-30px;font-size:22px;animation:float 7s linear infinite;opacity:.7}
@keyframes float{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="hero">
  <div class="glow"></div>
  <div class="card">
    <div class="small">Meri sabse pyaari</div>
    <h1>Maa ❤️</h1>
    <h2>Aap meri duniya ho</h2>
    <p>Maa, aapki muskaan mein meri khushi hai,<br>
    aapki duaon mein meri taaqat hai.<br>
    Aapne jo pyaar diya hai, uska badla<br>
    duniya ki koi cheez nahi de sakti.</p>
    <p><b>Thank you Maa, har cheez ke liye. 🌸</b></p>
    <button id="open">💗 Music ke saath kholiye</button>
  </div>
</div>

<script>
let audioCtx, timer, playing=false;
const notes=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23];
function playTone(freq,when,duration){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type="sine";o.frequency.value=freq;
  g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(.045,when+.04);
  g.gain.exponentialRampToValueAtTime(.001,when+duration);
  o.connect(g).connect(audioCtx.destination);
  o.start(when);o.stop(when+duration);
}
function startMusic(){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  let t=audioCtx.currentTime+.05;
  notes.forEach((n,i)=>playTone(n,t+i*.42,.65));
  timer=setInterval(()=>{
    const now=audioCtx.currentTime+.05;
    notes.forEach((n,i)=>playTone(n,now+i*.42,.65));
  },notes.length*.42*1000);
}
document.getElementById("open").onclick=()=>{
  if(!playing){startMusic();playing=true;}
  document.getElementById("open").textContent="💞 Maa ke liye ❤️";
  for(let i=0;i<14;i++){
    const h=document.createElement("div");h.className="heart";h.textContent="♥";
    h.style.left=Math.random()*100+"%";
    h.style.animationDelay=Math.random()*2+"s";
    document.querySelector(".hero").appendChild(h);
  }
};
</script>
</body>
